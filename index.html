<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Bhim Majhi</title>

    <!-- Preload critical assets -->
    <link rel="preload" href="style.css" as="style">
    <link rel="preload" href="https://bhimmajhi.cc.cd/logo.png?v=999" as="image">
    <link rel="preload" href="photo1.jpg" as="image">

    <link rel="icon" type="image/png" sizes="64x64" href="https://bhimmajhi.cc.cd/logo.png?v=999">
    <link rel="shortcut icon" type="image/png" href="https://bhimmajhi.cc.cd/logo.png?v=999">
    <link rel="apple-touch-icon" href="https://bhimmajhi.cc.cd/logo.png?v=999">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" id="mainStyle" href="style.css">
    
    <style>
        /* Prevent layout shift and flicker during load */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            background: #f0f9ff;
            color: #0c2340;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1.7;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px;
            position: relative;
            z-index: 2;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 0 20px;
            border-bottom: 1px solid rgba(44, 40, 36, 0.06);
            flex-wrap: wrap;
            position: relative;
            z-index: 10;
        }
        
        .logo {
            font-size: 1.9rem;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #0c2340;
            min-height: 40px;
        }
        
        .logo span {
            font-weight: 700;
            background: linear-gradient(135deg, #0ea5e9, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        nav {
            display: flex;
            gap: 36px;
            align-items: center;
        }
        
        nav a {
            color: #7a726a;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: 0.3s;
            position: relative;
        }
        
        nav a:hover {
            color: #2c2824;
        }
        
        /* Prevent page from being blank while loading */
        body.loading::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #f0f9ff;
            z-index: 9999;
            animation: fadeOut 0.5s ease-out 1s forwards;
        }
        
        @keyframes fadeOut {
            to {
                opacity: 0;
                pointer-events: none;
            }
        }
        
        /* Fade in content */
        main {
            animation: fadeIn 0.6s ease-in;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        .hero-banner {
            position: relative;
            width: 768px;
            height: 1376px;
            max-width: 100%;
            border-radius: 32px;
            overflow: hidden;
            margin: 10px auto 30px;
            background: #e8e0d8;
            box-shadow: 0 20px 60px -20px rgba(0,0,0,0.08);
        }
        
        .hero-banner img {
            width: 768px;
            height: 1376px;
            max-width: 100%;
            max-height: 100%;
            display: block;
        }
        
        .gallery-section {
            padding: 30px 0 70px;
        }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }
        
        .gallery-card {
            position: relative;
            border-radius: 32px;
            overflow: hidden;
            height: 400px;
            background: #e8e0d8;
            transition: 0.4s cubic-bezier(0.15, 0.85, 0.35, 1.2);
            border: 1px solid rgba(44, 40, 36, 0.04);
            box-shadow: 0 10px 30px -12px rgba(0,0,0,0.04);
            cursor: pointer;
        }
        
        .gallery-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .testimonial {
            background: #ffffff;
            border-radius: 50px;
            padding: 60px 50px;
            margin: 30px 0 70px;
            border: 1px solid rgba(44, 40, 36, 0.04);
            box-shadow: 0 10px 40px -12px rgba(0,0,0,0.02);
            text-align: center;
            position: relative;
        }
        
        .social-links-3d {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        
        .social-links-3d a {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: #fff;
            color: #7a726a;
            font-size: 1.5rem;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1), inset 0 2px 2px rgba(255,255,255,0.8);
            border: 1px solid rgba(255,255,255,0.6);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        /* Prevent overflow on all screen sizes */
        @media (max-width: 820px) {
            header {
                flex-direction: column;
                gap: 20px;
            }
            nav {
                gap: 18px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .container {
                padding: 0 20px;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 0 18px;
            }
            nav a {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body class="loading">
    <div class="glow-orb"></div>
    <div class="glow-orb-2"></div>

    <main class="container">
        <header>
            <div class="logo"><span>Smart</span>Alone</div>
            <nav>
                <a href="#">Portfolio</a>
                <a href="#">Editorial</a>
                <a href="#">Studio</a>
            </nav>
        </header>

        <section class="hero-banner">
            <img src="photo1.jpg" alt="Meri Photo · Hero" loading="eager">
            <div class="banner-overlay">
                <div class="banner-text">
                    <h2><strong>Smart</strong> Alone</h2>
                    <div class="meta">
                        <span><i class="fas fa-circle" style="font-size: 0.4rem; color: #38bdf8;"></i> Portrait · 2026</span>
                        <span><i class="fas fa-tag"></i> #smartalone</span>
                        <span><i class="fas fa-camera"></i> 50mm · f/2.8</span>
                    </div>
                </div>
                <div class="banner-tag">
                    <i class="fas fa-arrow-right"></i> featured editorial
                </div>
            </div>
        </section>

        <section class="gallery-section">
            <div class="section-header">
                <h2 class="section-title">More <strong>frames</strong></h2>
                <span class="section-sub"><i class="fas fa-arrow-right"></i> see all</span>
            </div>

            <div class="gallery-grid">
                <div class="gallery-card">
                    <img src="photo2.jpg" alt="Meri Photo · Rooftop" loading="lazy">
                    <div class="card-overlay">
                        <h3>Rooftop View</h3>
                        <div class="card-meta">Portrait · 2026</div>
                        <span class="card-tag">#sunset</span>
                    </div>
                </div>

                <div class="gallery-card">
                    <img src="https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=800&auto=format&fit=crop" alt="Neon Dusk" loading="lazy">
                    <div class="card-overlay">
                        <h3>Neon Dusk</h3>
                        <div class="card-meta">Night · 2026</div>
                        <span class="card-tag">#cinematic</span>
                    </div>
                </div>

                <div class="gallery-card">
                    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800&auto=format&fit=crop" alt="Earth & Sky" loading="lazy">
                    <div class="card-overlay">
                        <h3>Earth &amp; Sky</h3>
                        <div class="card-meta">Landscape · 2025</div>
                        <span class="card-tag">#minimal</span>
                    </div>
                </div>

                <!-- Firebase posts are inserted here automatically. -->
                <div id="firebaseGallery" class="firebase-gallery-contents"></div>
            </div>
        </section>

        <div class="testimonial">
            <div class="line"></div>
            <blockquote>— HELLO FRINDS</blockquote>
            <cite>— A. SMART ALONE</cite>

            <div class="social-container">
                <div class="social-links-3d">
                    <a href="mailto:cutenrml@gmail.com" target="_blank" class="gmail" title="Gmail">
                        <i class="fas fa-envelope"></i>
                    </a>
                    <a href="https://facebook.com/smrtalone" target="_blank" class="fb" title="Facebook">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                    <a href="https://instagram.com/smrtalone" target="_blank" class="insta" title="Instagram">
                        <i class="fab fa-instagram"></i>
                    </a>
                    <a href="https://whatsapp.com/channel/0029Vb6aYpiDOQIZlWFEYb0c" target="_blank" class="wa" title="WhatsApp">
                        <i class="fab fa-whatsapp"></i>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="app.js"></script>
    <script>
        // Remove loading state after CSS and images are ready
        window.addEventListener('load', function() {
            document.body.classList.remove('loading');
        });
        
        // Add cache busting with timestamp on page load
        (function() {
            const styleLink = document.getElementById('mainStyle');
            const timestamp = new Date().getTime();
            styleLink.href = 'style.css?t=' + timestamp;
        })();
        
        // Ensure no layout shift on reload
        document.documentElement.style.scrollBehavior = 'smooth';
    </script>
</body>
</html>
