<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bhim Majhi · Admin Upload</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="admin-card">
    <div class="brand">Smart<span>Alone</span></div>
    <h1>Photo / Video Upload</h1>
    <p class="muted">Ye page sirf Firebase par post upload karne ke liye hai.</p>

    <section id="loginBox">
      <input id="email" type="email" placeholder="Admin email">
      <input id="password" type="password" placeholder="Password">
      <button id="loginBtn">Login</button>
      <p id="loginMsg" class="msg"></p>
    </section>

    <section id="uploadBox" hidden>
      <div class="logged">Logged in: <span id="userEmail"></span></div>

      <input id="title" type="text" maxlength="80" placeholder="Title (e.g. Rooftop View)">
      <input id="tag" type="text" maxlength="30" placeholder="Tag (e.g. #sunset)">
      <input id="media" type="file" accept="image/*,video/*">

      <button id="uploadBtn">Upload & Publish</button>
      <button id="logoutBtn" class="secondary">Logout</button>

      <div class="progress-wrap">
        <div id="progressBar"></div>
      </div>
      <p id="status" class="msg"></p>

      <a class="back" href="index.html">← Website dekho</a>
    </section>
  </main>

  <script type="module" src="admin.js"></script>
</body>
</html>
